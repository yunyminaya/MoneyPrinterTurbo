# Archivo de reemplazo para GPU
# Uso: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requisitos previos:
#   1. Controlador de GPU NVIDIA instalado en el host
#   2. NVIDIA Container Toolkit instalado
#   3. Verifícalo con: docker info | grep nvidia
#
# Este archivo reemplaza el docker-compose.yml predeterminado para:
#   - Compilar con Dockerfile.gpu (imagen base CUDA de NVIDIA)
#   - Adjuntar dispositivos GPU a ambos servicios, porque la generación de video puede ejecutarse
#     tanto en el proceso de la WebUI como en el de la API
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
