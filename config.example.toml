# Ejemplo de configuración de MoneyPrinterTurbo.
# La aplicación copia este archivo a config.toml en la primera ejecución. Guarda tus claves API y otras
# credenciales en config.toml; no subas tu config.toml local al repositorio.

# =============================================================================
# Servicio API
# =============================================================================
# Nivel de registro: DEBUG, INFO, WARNING o ERROR.
log_level = "DEBUG"
# Usa 127.0.0.1 para acceso solo local. 0.0.0.0 escucha en todas las interfaces de red.
listen_host = "0.0.0.0"
listen_port = 8080

[app]

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

# Oculta el panel de configuración básica en la WebUI.
hide_config = false

# Tiempo de espera en segundos para una sola solicitud de transmisión de Edge TTS.
# En redes lentas puedes aumentarlo; el valor 0 desactiva el tiempo de espera.
edge_tts_timeout = 30

# Verifica los certificados TLS de las API externas y las descargas de material.
# Debe permanecer activado; solo desactívalo temporalmente en entornos de confianza con proxy o certificados autofirmados.
tls_verify = true

# -----------------------------------------------------------------------------
# Materiales de video
# -----------------------------------------------------------------------------

# Valores disponibles: "pexels", "pixabay", "coverr", "local".
video_source = "pexels"

# Las listas de claves API admiten rotación de claves. Usa comillas dobles ASCII rectas y
# separa múltiples claves con comas, por ejemplo: ["key-1", "key-2"].

# Regístrate en https://www.pexels.com/api/
pexels_api_keys = []

# Regístrate en https://pixabay.com/api/docs/
pixabay_api_keys = []

# Regístrate en https://coverr.co/developers?ctx=header_navigation
coverr_api_keys = []

# Integración opcional de TwelveLabs para clasificación semántica de materiales y control de calidad de video.
# Instala la dependencia opcional con: uv sync --extra twelvelabs
# Crea una clave API en https://playground.twelvelabs.io/
twelvelabs_api_keys = []
# Reordena los términos de búsqueda usando Marengo antes de descargar los materiales. Esta opción
# se ignora cuando match_materials_to_script está activado.
twelvelabs_rerank_terms = false
# Reemplazos de modelo opcionales. Descomenta solo cuando se requiera un modelo distinto.
# twelvelabs_marengo_model = "marengo3.0"
# twelvelabs_pegasus_model = "pegasus1.5"

# Hace coincidir los términos de búsqueda y los materiales descargados con el orden narrativo del guion.
# Está desactivado por defecto; al activarlo reduce la aleatoriedad y el orden del material se ajusta más a la estructura del texto.
match_materials_to_script = false

# Música de fondo original opcional de Sonilo, coincidente con el video.
# Crea una clave en https://platform.sonilo.com/dashboard. La WebUI también puede guardar
# este valor, o puedes usar la variable de entorno SONILO_API_KEY en su lugar.
sonilo_api_key = ""
sonilo_base_url = "https://api.sonilo.com"
# Tiempo máximo de espera en segundos sin datos durante una sola secuencia de generación; no es el límite de tiempo total de la solicitud.
sonilo_timeout = 600

# -----------------------------------------------------------------------------
# Proveedores de LLM
# -----------------------------------------------------------------------------

# Las definiciones de proveedores, los modelos predeterminados y las URL base predeterminadas se mantienen en
# app/models/llm_provider.py. Deja model_name y base_url vacíos para seguir los
# valores predeterminados del registro; configúralos solo cuando necesites un reemplazo explícito.
llm_provider = "moonshot"

# Kimi / Moonshot AI
# Clave API: https://platform.kimi.com/console/api-keys
moonshot_api_key = ""
moonshot_base_url = ""
moonshot_model_name = ""

# OpenAI u otro proveedor compatible con OpenAI Chat Completions.
# Clave API: https://platform.openai.com/api-keys
openai_api_key = ""
openai_base_url = ""
openai_model_name = ""

# Google Gemini
# Clave API: https://aistudio.google.com/app/apikey
gemini_api_key = ""
gemini_model_name = ""

# DeepSeek
# Clave API: https://platform.deepseek.com/api_keys
deepseek_api_key = ""
deepseek_base_url = ""
deepseek_model_name = ""

# Alibaba Cloud Qwen
# Clave API: https://dashscope.console.aliyun.com/apiKey
qwen_api_key = ""
qwen_model_name = ""

# Microsoft Azure OpenAI. model_name es el nombre del despliegue.
# Documentación: https://learn.microsoft.com/azure/ai-services/openai/reference
azure_api_key = ""
azure_base_url = ""
azure_model_name = ""
azure_api_version = "2024-02-15-preview"

# ByteDance VolcEngine Ark
# Consola: https://console.volcengine.com/ark
volcengine_api_key = ""
volcengine_base_url = ""
volcengine_model_name = ""

# xAI Grok
# Clave API: https://console.x.ai/
grok_api_key = ""
grok_base_url = ""
grok_model_name = ""

# MiniMax. La clave API y la URL base deben usar la misma plataforma.
# China: https://platform.minimaxi.com/ | https://api.minimaxi.com/v1
# Internacional: https://platform.minimax.io/ | https://api.minimax.io/v1
minimax_api_key = ""
minimax_base_url = ""
minimax_model_name = ""

# Xiaomi MiMo
# Documentación: https://platform.xiaomimimo.com/docs/zh-CN/quick-start/first-api-call
mimo_api_key = ""
mimo_base_url = ""
mimo_model_name = ""

# Cloudflare AI Gateway. El token requiere permisos de lectura/escritura de AI Gateway y lectura de Workers AI.
# Deja gateway_id vacío para usar el valor predeterminado del registro.
# Panel: https://dash.cloudflare.com/
cloudflare_api_key = ""
cloudflare_account_id = ""
cloudflare_gateway_id = ""
cloudflare_model_name = ""

# Alibaba ModelScope. Vincula una cuenta de Alibaba Cloud antes de usar la inferencia por API.
# Documentación: https://modelscope.cn/docs/model-service/API-Inference/intro
modelscope_api_key = ""
modelscope_base_url = ""
modelscope_model_name = ""

# AIHubMix, una puerta de enlace multmodelo compatible con OpenAI.
# Clave API: https://aihubmix.com/
aihubmix_api_key = ""
aihubmix_base_url = ""
aihubmix_model_name = ""

# AIML API, una API multmodelo compatible con OpenAI.
# Clave API: https://aimlapi.com/app/keys
aimlapi_api_key = ""
aimlapi_base_url = ""
aimlapi_model_name = ""

# EvoLink, una puerta de enlace multmodelo compatible con OpenAI.
# Clave API: https://evolink.ai/dashboard/keys
evolink_api_key = ""
evolink_base_url = ""
evolink_model_name = ""

# Ollama. Deja base_url vacío para usar el valor predeterminado local consciente del entorno.
# Configura model_name con un modelo instalado mediante `ollama pull` o mostrado por `ollama list`.
ollama_base_url = ""
ollama_model_name = ""

# OneAPI. Usa el token, la URL base y el ID de modelo de tu despliegue de OneAPI.
# Proyecto: https://github.com/songquanpeng/one-api
oneapi_api_key = ""
oneapi_base_url = ""
oneapi_model_name = ""

# LiteLLM usa las credenciales del proveedor desde variables de entorno, como
# OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY o AWS_ACCESS_KEY_ID.
# Formatos de modelo: openai/gpt-4o, anthropic/claude-sonnet-4, ollama/llama3.
# Proveedores: https://docs.litellm.ai/docs/providers
litellm_model_name = ""

# Groq
# Clave API: https://console.groq.com/keys
groq_api_key = ""
groq_base_url = ""
groq_model_name = ""

# Pollinations AI: https://enter.pollinations.ai/
pollinations_api_key = ""
pollinations_base_url = ""
pollinations_model_name = ""

# -----------------------------------------------------------------------------
# Voz, subtítulos y video
# -----------------------------------------------------------------------------

# Xiaomi MiMo TTS comparte mimo_api_key y mimo_base_url con el LLM de MiMo.
mimo_tts_model_name = "mimo-v2.5-tts"
mimo_tts_style_prompt = "请用自然、清晰、适合短视频旁白的语气朗读。"

# Proveedor de subtítulos: "edge" o "whisper". Whisper solo se carga cuando se selecciona
# explícitamente; los fallos de Edge no activan una descarga automática del modelo de Whisper.
# Déjalo vacío para omitir la generación.
subtitle_provider = "edge"

# FFmpeg normalmente se descarga y detecta automáticamente. Si la detección falla,
# descárgalo desde https://www.gyan.dev/ffmpeg/builds/ y configura el ejecutable.
# Ejemplo en Windows: ffmpeg_path = "C:\\path\\to\\ffmpeg.exe"
# ffmpeg_path = ""

# Déjalo sin definir para seguir el valor predeterminado de la aplicación (libx264). Los codificadores de hardware son opcionales;
# los codificadores no admitidos vuelven automáticamente a libx264.
# Valores disponibles: "libx264", "h264_nvenc", "h264_amf", "h264_qsv",
# "h264_mf", "h264_videotoolbox".
# video_codec = "libx264"

# -----------------------------------------------------------------------------
# Almacenamiento y ejecución de tareas
# -----------------------------------------------------------------------------

# URL base pública usada para construir los enlaces de descarga de los videos generados. Déjala vacía para
# usar la dirección actual del servicio API, o configura una URL externa de proxy inverso.
endpoint = ""

# Almacenamiento de materiales: "" usa ./storage/cache_videos, "task" guarda los materiales en
# cada directorio de tarea, y una ruta absoluta los guarda en ese directorio.
# Ejemplo: material_directory = "/path/to/videos"
material_directory = ""

# Estado de tareas opcional respaldado por Redis. Mantén Redis privado para esta aplicación;
# escritores no confiables no deben poder modificar los registros serializados de tareas.
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

# Número máximo de tareas concurrentes y en cola de generación de video de la API.
max_concurrent_tasks = 5
max_queued_tasks = 100

# -----------------------------------------------------------------------------
# Publicación multiplataforma
# -----------------------------------------------------------------------------

# Upload-Post puede publicar los videos generados en TikTok, Instagram y YouTube.
# Crea una cuenta y una clave API en https://upload-post.com/
# Documentación de la API: https://docs.upload-post.com/
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
# Valores disponibles: "tiktok", "instagram", "youtube".
upload_post_platforms = ["tiktok", "instagram"]
# Publica automáticamente las salidas de video exitosas después de la generación.
upload_post_auto_upload = false
# Privacidad de YouTube: "public", "unlisted" o "private".
upload_post_youtube_privacy_status = "public"
# Número máximo de trabajos de publicación cruzada en ejecución y en cola por proceso. Cuando se alcanza
# el límite, la generación de video sigue teniendo éxito y solo se rechaza la publicación cruzada.
# Los trabajos de publicación cruzada se ejecutan en el proceso actual y no se reanudan tras reiniciar.
upload_post_max_pending_tasks = 10

# =============================================================================
# Subtítulos de Whisper
# =============================================================================

[whisper]
# El modelo se descarga automáticamente en el primer uso, a menos que exista un directorio local
# coincidente en ./models/whisper-{model_size}.
model_size = "large-v3"
# device: "cpu" o "cuda". Los tipos de cómputo comunes incluyen "int8" para CPU y
# "float16" o "int8_float16" para CUDA.
device = "cpu"
compute_type = "int8"

# =============================================================================
# Proxy para solicitudes de materiales
# =============================================================================

[proxy]
# Proxy opcional usado por Pexels, Pixabay, Coverr y las descargas de materiales.
# Formato: "http://<username>:<password>@<proxy>:<port>"
# Documentación: https://requests.readthedocs.io/en/latest/user/advanced/#proxies
# http = "http://127.0.0.1:3128"
# https = "http://127.0.0.1:1080"

# =============================================================================
# Proveedores de TTS
# =============================================================================

[azure]
# Credenciales de Azure Speech TTS. Son independientes de la configuración de Azure OpenAI.
# Clave API: https://portal.azure.com/#view/Microsoft_Azure_ProjectOxford/CognitiveServicesHub/~/SpeechServices
speech_key = ""
speech_region = ""

[siliconflow]
# Clave API de SiliconFlow TTS: https://siliconflow.cn/
api_key = ""

[elevenlabs]
# Clave API: https://elevenlabs.io/app/settings/api-keys
# Las voces favoritas de la biblioteca de voces de ElevenLabs se muestran en la WebUI.
api_key = ""
# Los modelos disponibles incluyen eleven_multilingual_v2, eleven_flash_v2_5 y eleven_v3.
model_id = "eleven_multilingual_v2"
# Video-to-Music usa una familia de modelos separada y comparte la misma clave API.
music_model_id = "music_v2"
music_timeout = 600

[chatterbox]
# Servidor Chatterbox TTS compatible con OpenAI. Los valores predeterminados apuntan a
# travisvn/chatterbox-tts-api ejecutándose localmente en el puerto 4123.
base_url = "http://127.0.0.1:4123/v1"
api_key = ""
model_id = "chatterbox"
# Nombres de voz expuestos por el servidor Chatterbox configurado.
voices = ["default-Female"]

# =============================================================================
# Preferencias de la WebUI
# =============================================================================

[ui]
# Oculta los registros de generación en la WebUI.
hide_log = false

# La WebUI escribe las preferencias restantes automáticamente. Descomenta los valores
# siguientes solo cuando quieras definir valores predeterminados iniciales manualmente.
# language = "zh"
# tts_server = "azure-tts-v1"
# voice_name = ""
# font_name = "MicrosoftYaHeiBold.ttc"
# font_size = 60
# text_fore_color = "#FFFFFF"
# subtitle_position = "bottom" # "top", "center", "bottom" o "custom"
# custom_position = 70.0       # Porcentaje desde arriba cuando se usa "custom"
# subtitle_background_enabled = false
# subtitle_background_color = "#000000"
# rounded_subtitle_background = false
